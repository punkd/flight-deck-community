name: Verify and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: flight-deck-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --tag flight-deck:verify .
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, test and smoke-check the release
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$image:$GITHUB_SHA" .
          docker run --detach --name flight-deck-smoke --publish 127.0.0.1:8080:8080 "$image:$GITHUB_SHA"
          trap 'docker rm -f flight-deck-smoke >/dev/null 2>&1 || true' EXIT
          if ! curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-connrefused --retry-delay 1 http://localhost:8080/healthz; then
            docker logs flight-deck-smoke
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:8080/ | grep -F 'DevOps Flight Deck'
      - name: Publish commit and stable tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_SHA"
          docker tag "$image:$GITHUB_SHA" "$image:stable"
          docker push "$image:stable"
