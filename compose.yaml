name: flight-deck
services:
  web:
    image: ${APP_IMAGE:-flight-deck:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    volumes:
      - tracker:/var/lib/flight-deck
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 8
      start_period: 5s
volumes:
  tracker:
